<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg-alina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <clipPath id="circle-clip-alina">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip-alina)">
    <rect width="100" height="100" fill="url(#bg-alina)" />
    <!-- Outdoor building pillars / blurred background -->
    <rect x="15" y="0" width="16" height="60" fill="#D1D5DB" opacity="0.4" />
    <rect x="70" y="0" width="18" height="60" fill="#D1D5DB" opacity="0.4" />
    
    <!-- Long Hair Back -->
    <path d="M22,35 C20,70 26,95 35,100 L65,100 C74,95 80,70 78,35 C78,16 65,14 50,14 C35,14 22,16 22,35 Z" fill="#4B382A" />
    
    <!-- Shoulders / Black Leather Jacket -->
    <path d="M12,105 C12,78 28,70 50,70 C72,70 88,78 88,105 Z" fill="#1F2937" />
    <path d="M38,70 L50,86 L62,70 Z" fill="#F3F4F6" />
    
    <!-- Neck -->
    <rect x="43" y="52" width="14" height="18" fill="#F0C5A8" rx="4" />
    
    <!-- Face -->
    <ellipse cx="50" cy="42" rx="17" ry="20" fill="#FBD8C0" />
    
    <!-- Long Hair Front Sides -->
    <path d="M28,32 C28,50 32,72 38,78 C35,68 34,48 35,36 Z" fill="#654A37" />
    <path d="M72,32 C72,50 68,72 62,78 C65,68 66,48 65,36 Z" fill="#654A37" />
    <!-- Hair Top / Fringe -->
    <path d="M28,30 C34,18 66,18 72,30 C64,22 36,22 28,30 Z" fill="#523B2B" />
    
    <!-- Eyes -->
    <circle cx="44" cy="41" r="2.2" fill="#2E241E" />
    <circle cx="56" cy="41" r="2.2" fill="#2E241E" />
    <circle cx="44.6" cy="40.5" r="0.8" fill="#FFFFFF" />
    <circle cx="56.6" cy="40.5" r="0.8" fill="#FFFFFF" />
    
    <!-- Eyebrows -->
    <path d="M40,36 Q45,34 48,37" stroke="#4B382A" stroke-width="1.6" stroke-linecap="round" />
    <path d="M60,36 Q55,34 52,37" stroke="#4B382A" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Nose & Lips -->
    <path d="M50,40 L50,46 L48,47" stroke="#DCA282" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M46,52 Q50,55 54,52" stroke="#BE4B5E" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
